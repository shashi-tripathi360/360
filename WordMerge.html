<template>
    <lightning-card title="Word Merge Viewer" icon-name="doctype:word">
        <div class="slds-m-around_medium">
            <lightning-input 
                type="file" 
                label="Upload Word Document"
                accept=".docx"
                onchange={handleFileChange}>
            </lightning-input>


            <br>
            <br>

            {previewHtmlwithtable}

             <br>


<br> 

             <!-- Word Download Button -->
    <lightning-button 
        label="Preview as PDF"
        title="Preview as PDF"
        variant="brand"
        onclick={handlePreviewAsPdf}>
    </lightning-button>


<br>

        </div>

        <template if:true={previewHtml}>
            <lightning-button label="Show Preview" onclick={openModal}></lightning-button>
        </template>

        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title">Document Preview</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <div lwc:dom="manual" class="doc-preview-modal"></div>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
